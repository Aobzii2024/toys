services:
  signaling:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run build && npm start"
    environment:
      PORT: 8080
      HOST: 0.0.0.0
      TURN_ENABLED: "true"
      LOG_LEVEL: info
    ports:
      - "8080:8080"
    volumes:
      - ./:/app
    restart: unless-stopped

  turn:
    image: coturn/coturn:4.6
    command:
      - --listening-port=3478
      - --fingerprint
      - --lt-cred-mech
      - --user=${TURN_USERNAME:-ctrlai}:${TURN_PASSWORD:-change-me}
      - --realm=${TURN_REALM:-ctrlai}
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --no-tls
      - --no-dtls
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    restart: unless-stopped
